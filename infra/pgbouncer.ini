[databases]
resolveit = host=postgres port=5432 dbname=resolveit

[pgbouncer]
listen_addr = 0.0.0.0
listen_port = 5432
unix_socket_dir = /tmp
pidfile = /tmp/resolveit-pgbouncer.pid
auth_type = scram-sha-256
auth_file = /tmp/resolveit-userlist.txt
pool_mode = transaction
max_client_conn = 200
default_pool_size = 20
reserve_pool_size = 5
server_reset_query = DISCARD ALL
server_reset_query_always = 1
ignore_startup_parameters = extra_float_digits
max_prepared_statements = 0
log_connections = 0
log_disconnections = 0
log_pooler_errors = 0
