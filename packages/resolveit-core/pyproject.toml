[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "resolveit-core"
version = "0.1.0"
description = "Calibrated IT incident framing and routing core"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = ["numpy>=2.0", "pydantic>=2.7", "tzdata"]

[project.optional-dependencies]
dev = ["pytest>=8", "hypothesis>=6.100", "ruff>=0.6", "mypy>=1.11"]

[tool.hatch.build.targets.wheel]
packages = ["resolveit_core"]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["RUF001", "RUF003"]

[tool.ruff.lint.per-file-ignores]
"resolveit_core/rules/engine.py" = ["E501"]
"tests/*" = ["E501"]

[tool.mypy]
strict = true
python_version = "3.12"
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["slow: statistical simulations and the 10,000-case property test"]
